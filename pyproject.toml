[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "fronts"
version = "1.2.12"
license = "BSD-3-Clause"
authors = [{ name = "Gabriel S. Gerlero", email = "ggerlero@cimec.unl.edu.ar" }]
description = "Numerical library for nonlinear diffusion problems in semi-infinite domains"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.13,<2",
    "numpy>=2,<3",
    "sympy>=1.2,<2",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8,<4"]

[project.urls]
Homepage = "https://github.com/gerlero/fronts"
Repository = "https://github.com/gerlero/fronts"
Documentation = "https://fronts.readthedocs.io"
Changelog = "https://github.com/gerlero/fronts/blob/main/CHANGELOG.md"

[dependency-groups]
examples = ["fronts[examples]"]
lint = ["ruff>=0.16.5,<0.17"]
typing = [
    "mypy>=1,<3",
    "scipy-stubs>=1,<2",
]
test = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "fronts[examples]",
]
docs = [
    "sphinx>=8,<10",
    "sphinx_rtd_theme>=3,<4",
]
dev = [
    {include-group = "examples"},
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "test"},
    {include-group = "docs"},
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
packages = [
    "fronts",
    "tests",
    "symbolic",
]
strict = true
